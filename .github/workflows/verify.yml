name: Verify Chrome printer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QA_SLUG: extension-ci
      FIN3000_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: npm ci
      - run: npm run extension:doctor
      - run: npm run extension:g1:doctor
      - run: npm run extension:g1:build
      - run: npm run extension:typecheck
      - run: npm run extension:test
      - run: npm run extension:repro:qa
      - run: npm run extension:repro:prod
  service-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
      - name: Check public OAuth discovery without credentials
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { apiOrigin } = JSON.parse(readFileSync('browser-extension/config/production.template.json', 'utf8'));
          const url = new URL('/.well-known/oauth-authorization-server', apiOrigin);
          const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(5000) });
          if (!response.ok) throw new Error(`OAuth metadata HTTP ${response.status}`);
          const body = await response.json();
          if (!body.authorization_endpoint || !body.token_endpoint) throw new Error('OAuth metadata incomplete');
          NODE
